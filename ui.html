<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>portfolio</title>
<script src="vendor/chart.umd.min.js"></script>
<style>
:root{
  --accent:#c084fc;
  --accent-soft:rgba(192,132,252,.16);
  --pos:#34d399; --pos-soft:rgba(52,211,153,.14);
  --neg:#fb7185; --neg-soft:rgba(251,113,133,.14);
  --ink:#f4f6fb; --dim:#9aa3b8; --faint:#6b7385;
  --glass:rgba(17,20,31,.62);
  --glass-2:rgba(28,33,49,.55);
  --hair:rgba(255,255,255,.08);
  --mono:'SF Mono','JetBrains Mono','Fira Code',ui-monospace,monospace;
  --sans:'Inter',-apple-system,'Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;overflow:hidden;
  font-family:var(--sans);color:var(--ink);
  -webkit-font-smoothing:antialiased;user-select:none;cursor:default}
::-webkit-scrollbar{width:7px}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22)}

#app{position:fixed;inset:0;padding:18px;display:flex}
.panel{
  position:relative;flex:1;display:flex;flex-direction:column;
  border-radius:22px;overflow:hidden;
  background:linear-gradient(160deg,var(--glass),var(--glass-2));
  border:1px solid var(--hair);
  box-shadow:0 24px 60px -20px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.03),
             inset 0 1px 0 rgba(255,255,255,.06);
  backdrop-filter:blur(26px) saturate(1.5);
  -webkit-backdrop-filter:blur(26px) saturate(1.5);
  animation:rise .5s cubic-bezier(.2,.8,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.panel::before{content:'';position:absolute;inset:-1px;border-radius:22px;
  background:radial-gradient(120% 80% at 100% 0%,var(--accent-soft),transparent 60%);
  pointer-events:none;opacity:.9}

/* ----------------------------------------------------------------- header */
.hdr{display:flex;align-items:center;gap:10px;padding:15px 16px 11px}
.brand{display:flex;align-items:center;gap:9px;flex:0 0 auto;min-width:0}
.spark-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 0 var(--accent);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--accent-soft)}
  70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.brand h1{font-size:12px;letter-spacing:.22em;font-weight:700;color:var(--dim);
  text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;gap:4px}
.tool{width:28px;height:28px;border:none;border-radius:9px;cursor:pointer;
  background:rgba(255,255,255,.05);color:var(--dim);font-size:13px;
  display:grid;place-items:center;transition:.15s}
.tool:hover{background:rgba(255,255,255,.12);color:var(--ink);transform:translateY(-1px)}
.tool.close:hover{background:var(--neg-soft);color:var(--neg)}
.drag{flex:1;align-self:stretch}

/* ------------------------------------------------------------------ hero */
.hero{padding:4px 18px 14px;cursor:pointer;border-radius:14px;margin:0 8px;transition:background .15s}
.hero:hover{background:rgba(255,255,255,.04)}
.hero .label{font-size:10.5px;letter-spacing:.16em;color:var(--faint);
  text-transform:uppercase;margin-bottom:3px;display:flex;gap:6px;align-items:center}
.hero .label .hint{opacity:0;transition:.15s;font-size:9px;letter-spacing:.1em}
.hero:hover .label .hint{opacity:.7}
.total{font-family:var(--mono);font-size:34px;font-weight:600;letter-spacing:-.5px;
  line-height:1;display:flex;align-items:baseline;gap:2px}
.total .cur{font-size:18px;color:var(--dim);font-weight:500}
.subline{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:999px;
  font-family:var(--mono);font-size:12px;font-weight:600}
.pill.up{background:var(--pos-soft);color:var(--pos)}
.pill.down{background:var(--neg-soft);color:var(--neg)}
.pilltag{font-size:8.5px;letter-spacing:.06em;text-transform:uppercase;opacity:.6;font-weight:700}
.ret{font-family:var(--mono);font-size:12px;color:var(--dim)}
.ret b{font-weight:600}
/* hero headline is the % return; the all-time gain (₪) rides just beside it, a touch smaller */
.hrow{display:flex;align-items:baseline;gap:10px;flex-wrap:nowrap;white-space:nowrap}
.total{white-space:nowrap}
.total.bigret.up{color:var(--pos)} .total.bigret.down{color:var(--neg)}
.bigamt{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.3px;white-space:nowrap}
.bigamt.up{color:var(--pos)} .bigamt.down{color:var(--neg)}
.bigpx .bigamt{font-size:20px;margin-left:11px}
.valsmall{font-family:var(--mono);font-size:14.5px;font-weight:600;color:var(--ink);
  display:inline-flex;align-items:baseline;gap:1px}
.valsmall .cur{font-size:11px;color:var(--dim);font-weight:500}

.heromini{height:54px;margin:2px 8px 2px;position:relative}
.heromini canvas{position:absolute;inset:0;width:100%;height:100%}

/* --------------------------------------------------------------- holdings */
.list{flex:1;overflow-y:auto;padding:4px 8px 8px}
.row{display:grid;grid-template-columns:1fr 50px auto;align-items:center;gap:9px;
  padding:9px 10px;border-radius:13px;cursor:pointer;position:relative;
  transition:background .15s,transform .12s}
.row:hover{background:rgba(255,255,255,.055);transform:translateX(2px)}
.row .id{min-width:0}
.row .tk{font-weight:700;font-size:13.5px;letter-spacing:.02em}
.row .nm{font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:135px;margin-top:1px}
.row .sub{display:flex;align-items:center;gap:6px;margin-top:5px;flex-wrap:nowrap;min-width:0}
.row .sub .val{font-family:var(--mono);font-size:11px;font-weight:600;color:var(--dim);
  white-space:nowrap;flex:0 0 auto}
.row .sub .val.up{color:var(--pos)} .row .sub .val.down{color:var(--neg)}
.row .wt{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--accent);
  background:var(--accent-soft);padding:2px 5px;border-radius:7px;white-space:nowrap;letter-spacing:.01em;flex:0 1 auto;overflow:hidden;text-overflow:ellipsis}
.row .sparkrow{height:30px}
.row .sparkrow canvas{width:100%;height:100%}
.row .px{text-align:right;font-family:var(--mono);line-height:1.18}
.row .px .p{font-size:13px;font-weight:600}
.row .px .d{font-size:10.5px;font-weight:600;margin-top:2px}
.row .px .r{font-size:10.5px;font-weight:600;margin-top:1px}
.row .px .tag{font-size:8px;letter-spacing:.06em;color:var(--faint);font-weight:700;margin-right:3px}
.up{color:var(--pos)} .down{color:var(--neg)}
.row .chev{position:absolute;right:6px;top:50%;transform:translateY(-50%);
  opacity:0;color:var(--faint);font-size:12px;transition:.15s}
.row:hover .chev{opacity:1;right:3px}
.row.err{opacity:.5}

/* ----------------------------------------------------------------- footer */
.foot{display:flex;align-items:center;gap:8px;padding:9px 16px;
  border-top:1px solid var(--hair);font-size:10.5px;color:var(--faint)}
.foot .live{width:6px;height:6px;border-radius:50%;background:var(--pos);
  box-shadow:0 0 8px var(--pos);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.3}}
.foot .grow{flex:1}

/* ===================================================================== DETAIL */
.detail{position:absolute;inset:0;display:flex;flex-direction:column;
  opacity:0;pointer-events:none;transform:scale(.99);transition:.28s cubic-bezier(.2,.8,.2,1)}
body.mode-detail .detail{opacity:1;pointer-events:auto;transform:none}
body.mode-detail .compact{opacity:0;pointer-events:none}
.compact{display:flex;flex-direction:column;flex:1;transition:opacity .2s}

.dhdr{display:flex;align-items:center;gap:12px;padding:15px 18px 10px}
.back{display:inline-flex;align-items:center;gap:6px;border:none;cursor:pointer;
  background:rgba(255,255,255,.06);color:var(--ink);padding:7px 12px;border-radius:10px;
  font-size:12px;font-weight:600;transition:.15s}
.back:hover{background:rgba(255,255,255,.13);transform:translateX(-2px)}
.dttl{display:flex;align-items:baseline;gap:10px;flex:1;min-width:0}
.dttl .tk{font-size:20px;font-weight:700}
.dttl .nm{font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dttl .ex{font-size:10px;color:var(--faint);letter-spacing:.1em;text-transform:uppercase}

.dbody{flex:1;display:grid;grid-template-columns:300px 1fr;gap:16px;
  padding:6px 18px 18px;min-height:0}
.dcol{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto}
.bigpx{font-family:var(--mono);font-size:32px;font-weight:600;line-height:1}
.bigpx .cur{font-size:15px;color:var(--dim)}
.bigchg{font-family:var(--mono);font-size:14px;font-weight:600;margin-top:6px;
  display:flex;gap:8px;align-items:center}

.card{background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:15px;
  padding:13px 15px}
.card h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);
  margin-bottom:10px;font-weight:700}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;font-size:12.5px}
.kv .k{color:var(--dim)}
.kv .v{font-family:var(--mono);text-align:right;font-weight:600}

.chartwrap{flex:1;display:flex;flex-direction:column;min-height:0;
  background:rgba(255,255,255,.03);border:1px solid var(--hair);border-radius:16px;padding:12px 14px}
.ranges{display:flex;gap:6px;margin-bottom:8px}
.rbtn{border:none;cursor:pointer;background:rgba(255,255,255,.05);color:var(--dim);
  padding:5px 12px;border-radius:8px;font-size:11px;font-weight:700;letter-spacing:.04em;
  transition:.15s;font-family:var(--mono)}
.rbtn:hover{background:rgba(255,255,255,.12);color:var(--ink)}
.rbtn.on{background:var(--accent);color:#0a0c12}
.canvas-host{flex:1;position:relative;min-height:0}
.canvas-host canvas{position:absolute;inset:0}
.cspin{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);
  font-size:12px;opacity:0;transition:.2s;pointer-events:none}
.cspin.on{opacity:1}

.hidden{display:none!important}

/* ---- privacy: money amounts redacted by default, click any to peek ---- */
.amt{cursor:pointer;border-radius:6px;-webkit-user-select:none;
  transition:background .15s,box-shadow .15s}
/* hidden = solid frosted bar over the exact glyph box: no digit leaks, no layout shift.
   we null only the TEXT FILL (not `color`) so each amount keeps its own up/down colour on reveal */
body.hide-amts .amt{
  -webkit-text-fill-color:transparent;
  background-color:rgba(150,160,184,.36);
  background-image:repeating-linear-gradient(115deg,
     rgba(255,255,255,.12) 0 3px, rgba(255,255,255,0) 3px 7px);
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.10), 0 1px 6px rgba(0,0,0,.22); }
body.hide-amts .amt:hover{ background-color:rgba(176,186,210,.5); }
body.hide-amts .amt.show{
  -webkit-text-fill-color:currentColor; background:none; box-shadow:none; }
.eye-on{color:var(--accent)!important}
.eye-on svg{filter:drop-shadow(0 0 5px var(--accent-soft))}
</style>
</head>
<body class="mode-compact">
<div id="app"><div class="panel">

  <!-- ============================ COMPACT ============================ -->
  <div class="compact">
    <div class="hdr">
      <div class="brand">
        <span class="spark-dot"></span>
        <h1>Portfolio</h1>
      </div>
      <div class="drag" id="dragZone"></div>
      <div class="tools">
        <button class="tool" id="bEye" title="Show amounts"></button>
        <button class="tool" id="bRefresh" title="Refresh">⟳</button>
        <button class="tool" id="bSettings" title="Edit holdings">✎</button>
        <button class="tool close" id="bClose" title="Hide (Ctrl+Shift+P)">✕</button>
      </div>
    </div>

    <div class="hero" id="heroClick">
      <div class="label">All-time return <span class="hint">click for overview ›</span></div>
      <div class="hrow">
        <div class="total bigret up" id="totRet">+0.00%</div>
        <div class="bigamt amt up" id="totRetAmt">+₪0</div>
      </div>
      <div class="subline">
        <span class="valsmall"><span class="cur" id="curSym">₪</span><span id="totVal" class="amt">0</span></span>
        <span class="pill up" id="dayPill">+0.00%</span>
      </div>
    </div>
    <div class="heromini"><canvas id="heroSpark"></canvas></div>

    <div class="list" id="list"></div>

    <div class="foot">
      <span class="live"></span>
      <span id="status">connecting…</span>
      <span class="grow"></span>
      <span id="stamp"></span>
    </div>
  </div>

  <!-- ============================ DETAIL ============================ -->
  <div class="detail">
    <div class="dhdr">
      <button class="back" id="bBack">‹ Back</button>
      <div class="dttl">
        <span class="tk" id="dTk"></span>
        <span class="nm" id="dNm"></span>
        <span class="ex" id="dEx"></span>
      </div>
      <div class="tools">
        <button class="tool" id="bEye2" title="Show amounts"></button>
        <button class="tool close" id="bClose2" title="Hide">✕</button>
      </div>
    </div>
    <div class="dbody">
      <div class="dcol">
        <div>
          <div class="bigpx"><span class="cur" id="dCur">$</span><span id="dPrice">—</span><span id="dBigAmt"></span></div>
          <div class="bigchg" id="dChg"></div>
        </div>
        <div class="card" id="posCard">
          <h3>Your position</h3>
          <div class="kv" id="posKv"></div>
        </div>
        <div class="card" id="statCard">
          <h3>Market</h3>
          <div class="kv" id="statKv"></div>
        </div>
      </div>
      <div class="chartwrap">
        <div class="ranges" id="ranges"></div>
        <div class="canvas-host">
          <canvas id="bigChart"></canvas>
          <div class="cspin" id="cspin">loading…</div>
        </div>
      </div>
    </div>
  </div>

</div></div>

<script>
//=============================================================== bridge + util
const BR = (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.bridge);
function send(o){ try{ BR.postMessage(JSON.stringify(o)); }catch(e){ console.log('bridge',o); } }

//------------------------------------------------------------ privacy / redact
let HIDDEN = true;   // always start hidden — modest by default; eye reveals for the session
// icon shows the ACTION it performs: plain eye = "press to show", eye-with-slash = "press to hide"
const EYE_SVG='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
const EYEOFF_SVG='<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
function amt(s){ return '<span class="amt">'+s+'</span>'; }
function applyHidden(){
  document.body.classList.toggle('hide-amts', HIDDEN);
  ['bEye','bEye2'].forEach(id=>{ const b=document.getElementById(id);
    if(b){ b.innerHTML = HIDDEN ? EYE_SVG : EYEOFF_SVG;
           b.title = HIDDEN ? 'Show amounts' : 'Hide amounts';
           b.classList.toggle('eye-on', !HIDDEN); } });
}
function toggleHidden(){
  HIDDEN=!HIDDEN;
  if(HIDDEN) document.querySelectorAll('.amt.show').forEach(a=>a.classList.remove('show'));
  applyHidden(); redrawChart();
}
// switch compact<->detail WITHOUT clobbering hide-amts (className= would wipe the redaction)
function setMode(m){
  document.body.classList.remove('mode-compact','mode-detail');
  document.body.classList.add(m);
  applyHidden();
}

let CUR='ILS', CURSYM='₪';
const SYMS={USD:'$',EUR:'€',GBP:'£',ILS:'₪',JPY:'¥',CAD:'C$',AUD:'A$',CHF:'CHF '};
function fmtMoney(n,dp=2){ if(n==null||isNaN(n)) return '—';
  return Number(n).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp}); }
function fmtPct(n){ return (n>=0?'+':'')+Number(n||0).toFixed(2)+'%'; }
function fmtSigned(n,dp=2){ return (n>=0?'+':'−')+CURSYM+fmtMoney(Math.abs(n),dp); }
function cls(n){ return n>=0?'up':'down'; }
function arrow(n){ return n>=0?'▲':'▼'; }
function abbrev(n){ if(n==null) return '—'; const a=Math.abs(n);
  if(a>=1e12) return (n/1e12).toFixed(2)+'T'; if(a>=1e9) return (n/1e9).toFixed(2)+'B';
  if(a>=1e6) return (n/1e6).toFixed(2)+'M'; if(a>=1e3) return (n/1e3).toFixed(1)+'K';
  return String(Math.round(n)); }
function getCss(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }

function animateNum(el,to,dp=2){
  const from=Number(el.__v||0); el.__v=to;
  const t0=performance.now(),dur=650;
  function step(t){ const k=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-k,3);
    el.textContent=fmtMoney(from+(to-from)*e,dp); if(k<1)requestAnimationFrame(step); }
  requestAnimationFrame(step);
}

//=============================================================== sparkline
function sparkline(canvas,data,color){
  if(!canvas) return;
  const dpr=window.devicePixelRatio||1,w=canvas.clientWidth,h=canvas.clientHeight;
  if(!w||!h) return;
  canvas.width=w*dpr; canvas.height=h*dpr; const c=canvas.getContext('2d'); c.scale(dpr,dpr);
  c.clearRect(0,0,w,h);
  if(!data||data.length<2) return;
  const mn=Math.min(...data),mx=Math.max(...data),rng=(mx-mn)||1,pad=3;
  const X=i=>i/(data.length-1)*w, Y=v=>h-pad-((v-mn)/rng)*(h-2*pad);
  const grad=c.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,color+'55'); grad.addColorStop(1,color+'00');
  c.beginPath(); c.moveTo(0,h); data.forEach((v,i)=>c.lineTo(X(i),Y(v)));
  c.lineTo(w,h); c.closePath(); c.fillStyle=grad; c.fill();
  c.beginPath(); data.forEach((v,i)=>i?c.lineTo(X(i),Y(v)):c.moveTo(X(i),Y(v)));
  c.strokeStyle=color; c.lineWidth=1.6; c.lineJoin='round'; c.stroke();
  c.beginPath(); c.arc(X(data.length-1),Y(data[data.length-1]),2.2,0,7); c.fillStyle=color; c.fill();
}

//=============================================================== compact render
let LAST=null;
function setData(snap){
  LAST=snap; CUR=snap.baseCurrency||'USD'; CURSYM=SYMS[CUR]||(CUR+' ');
  document.getElementById('curSym').textContent=CURSYM;
  const t=snap.totals;
  animateNum(document.getElementById('totVal'),t.marketValue,0);   // whole ₪ in the compact card
  const tr=document.getElementById('totRet');             // headline = all-time return %
  tr.className='total bigret '+cls(t.totalReturn);
  tr.textContent=fmtPct(t.totalReturnPct);
  const tra=document.getElementById('totRetAmt');         // …with the ₪ gain right beside it (whole ₪, one line)
  tra.className='bigamt amt '+cls(t.totalReturn);
  tra.textContent=fmtSigned(t.totalReturn,0);
  const dp=document.getElementById('dayPill');           // today: % + how much (₪) it rose
  dp.className='pill '+(t.dayChange>=0?'up':'down');
  dp.innerHTML=arrow(t.dayChange)+' '+fmtPct(t.dayChangePct)+' '+amt(fmtSigned(t.dayChange,0))
    +'<span class="pilltag">today</span>';

  const iv=(snap.intraday&&snap.intraday.v)||[];
  sparkline(document.getElementById('heroSpark'),iv,t.dayChange>=0?getCss('--pos'):getCss('--neg'));

  const L=document.getElementById('list'); L.innerHTML='';
  snap.holdings.forEach(h=>{
    const row=document.createElement('div');
    row.className='row'+(h.ok?'':' err');
    row.innerHTML=`
      <div class="id">
        <div class="tk">${h.ticker}</div>
        <div class="nm">${h.name||''}</div>
        <div class="sub">
          <span class="val amt ${cls(h.totalReturn)}">${fmtSigned(h.totalReturn,0)}</span>
          <span class="wt">${(h.weight||0).toFixed(1)}% of port</span>
        </div>
      </div>
      <div class="sparkrow"><canvas></canvas></div>
      <div class="px">
        <div class="p">${h.ok?(h.priceCur||CURSYM)+fmtMoney(h.price):'—'}</div>
        <div class="d ${cls(h.dayChangePct)}">${h.ok?'<span class="tag">1D</span>'+arrow(h.dayChangePct)+' '+fmtPct(h.dayChangePct):(h.error||'err')}</div>
        ${h.ok?`<div class="r ${cls(h.totalReturnPct)}"><span class="tag">ALL</span>${arrow(h.totalReturnPct)} ${fmtPct(h.totalReturnPct)}</div>`:''}
      </div>
      <span class="chev">›</span>`;
    row.onclick=()=>openDetail(h.ticker);
    L.appendChild(row);
    if(h.ok) sparkline(row.querySelector('canvas'),h.spark,h.dayChangePct>=0?getCss('--pos'):getCss('--neg'));
  });

  document.getElementById('status').textContent=snap.holdings.length+' holdings · '+CUR;
  const d=new Date((snap.asOf||Date.now()/1000)*1000);
  document.getElementById('stamp').textContent='updated '+d.toLocaleTimeString();
}

//=============================================================== detail
let curTicker=null, curRange='1D', bigChart=null;
const RANGE_KEYS=['1D','1W','1M','1Y','MAX'];
function buildRanges(){
  const r=document.getElementById('ranges'); r.innerHTML='';
  RANGE_KEYS.forEach(k=>{
    const b=document.createElement('button');
    b.className='rbtn'+(k===curRange?' on':''); b.textContent=k;
    b.onclick=()=>{ curRange=k; [...r.children].forEach(x=>x.classList.toggle('on',x.textContent===k)); requestChart(); };
    r.appendChild(b);
  });
}
function kvRows(rows){ return rows.map(([k,v])=>`<div class="k">${k}</div><div class="v">${v}</div>`).join(''); }

function openDetail(ticker){
  curTicker=ticker; curRange='1D';
  const h=(LAST.holdings||[]).find(x=>x.ticker===ticker);
  document.getElementById('dTk').textContent = (h&&h.kind==='fund') ? h.name : ticker;
  document.getElementById('dNm').textContent = h ? ((h.kind==='fund') ? ('#'+ticker) : h.name) : '';
  document.getElementById('dEx').textContent = h&&h.exchange ? h.exchange : '';
  const pc=(h&&h.priceCur)||CURSYM;
  document.getElementById('dCur').textContent=pc;
  const dpx=document.getElementById('dPrice'); dpx.classList.remove('amt'); dpx.style.color='';
  dpx.textContent=h&&h.ok?fmtMoney(h.price):'—';
  const dba=document.getElementById('dBigAmt'); dba.className=''; dba.textContent='';  // price view: no % gain beside it
  const chg=document.getElementById('dChg');
  if(h&&h.ok){ chg.className='bigchg '+cls(h.dayChangePct);
    chg.innerHTML=`<span>${arrow(h.dayChangePct)} ${amt(fmtSigned(h.dayChange))} (${fmtPct(h.dayChangePct)})</span><span style="color:var(--faint)">today</span>`;
  } else chg.textContent='';
  document.getElementById('posCard').querySelector('h3').textContent='Your position';
  document.getElementById('statCard').querySelector('h3').textContent='Market';
  if(h){
    document.getElementById('posKv').innerHTML=kvRows([
      ['Shares / units', fmtMoney(h.shares, h.shares%1?2:0)],
      ['Avg buy price', (h.avgCostCur||CURSYM)+fmtMoney(h.avgCost, h.avgCost<10?4:2)],
      ['Market value', amt(CURSYM+fmtMoney(h.marketValue))],
      ['Cost basis', amt(CURSYM+fmtMoney(h.costBasis))],
      ['Total return', `<span class="${cls(h.totalReturn)}">${amt(fmtSigned(h.totalReturn))} (${fmtPct(h.totalReturnPct)})</span>`],
      ['Day P&L', `<span class="${cls(h.dayChange)}">${amt(fmtSigned(h.dayChange))} (${fmtPct(h.dayChangePct)})</span>`],
      ['Weight', h.weight.toFixed(1)+'%'],
    ]);
    const stats=[['Prev close', pc+fmtMoney(h.prevClose)]];
    if(h.dayLow) stats.push(['Day range', pc+fmtMoney(h.dayLow)+' – '+pc+fmtMoney(h.dayHigh)]);
    if(h.week52Low) stats.push(['52-wk range', pc+fmtMoney(h.week52Low)+' – '+pc+fmtMoney(h.week52High)]);
    if(h.volume) stats.push(['Volume', abbrev(h.volume)]);
    if(h.kind==='fund') stats.push(['Tracks', 'Nasdaq-100 · live']);
    document.getElementById('statKv').innerHTML=kvRows(stats);
  }
  buildRanges();
  setMode('mode-detail');
  send({action:'expand'});
  requestChart();
}

function openOverview(){
  curTicker='__PORTFOLIO__'; curRange='1D';
  const t=LAST.totals;
  document.getElementById('dTk').textContent='Portfolio';
  document.getElementById('dNm').textContent='';
  document.getElementById('dEx').textContent=LAST.holdings.length+' holdings';
  document.getElementById('dCur').textContent='';
  const dPriceEl=document.getElementById('dPrice');
  dPriceEl.classList.remove('amt');                   // headline = return %, always visible
  dPriceEl.style.color=(t.totalReturn>=0?'var(--pos)':'var(--neg)');
  dPriceEl.textContent=fmtPct(t.totalReturnPct);
  const dba=document.getElementById('dBigAmt');       // …with the ₪ all-time gain beside it
  dba.className='bigamt amt '+cls(t.totalReturn);
  dba.textContent=fmtSigned(t.totalReturn,0);
  const chg=document.getElementById('dChg');           // mirror the small display: value + (today % & ₪)
  chg.className='bigchg '+cls(t.dayChange);
  chg.innerHTML=`<span class="valsmall"><span class="cur">${CURSYM}</span>${amt(fmtMoney(t.marketValue,0))}</span>`
    +`<span class="${cls(t.dayChange)}">${arrow(t.dayChange)} ${fmtPct(t.dayChangePct)} ${amt(fmtSigned(t.dayChange,0))}</span>`
    +`<span style="color:var(--faint)">today</span>`;
  const ok=LAST.holdings.filter(h=>h.ok);
  document.getElementById('posCard').querySelector('h3').textContent='Allocation';
  const inc=LAST.income||{total:0};
  document.getElementById('posKv').innerHTML=ok.slice(0,8).map(h=>
    `<div class="k">${h.kind==='fund'?h.name:h.ticker}</div><div class="v">${h.weight.toFixed(1)}%</div>`).join('')
    + ((LAST.cash||LAST.cashDisplay)?`<div class="k">${LAST.cashLabel||'Cash'}</div><div class="v">${amt(LAST.cashDisplay||(CURSYM+fmtMoney(LAST.cash)))}</div>`:'')
    + `<div class="k">Income logged</div><div class="v">${amt(CURSYM+fmtMoney(inc.total))}</div>`;
  document.getElementById('statCard').querySelector('h3').textContent='Top movers today';
  const movers=[...ok].sort((a,b)=>Math.abs(b.dayChangePct)-Math.abs(a.dayChangePct)).slice(0,5);
  document.getElementById('statKv').innerHTML=movers.map(h=>
    `<div class="k">${h.kind==='fund'?h.name:h.ticker}</div><div class="v ${cls(h.dayChangePct)}">${arrow(h.dayChangePct)} ${fmtPct(h.dayChangePct)}</div>`).join('');
  buildRanges();
  setMode('mode-detail');
  send({action:'expand'});
  drawBigChart(LAST.intraday.t,LAST.intraday.v,t.dayChange>=0,CURSYM);
}

function closeDetail(){ setMode('mode-compact'); send({action:'collapse'});
  setTimeout(()=>{ if(LAST){ setData(LAST); applyHidden(); } },80); }

//=============================================================== big chart
function spin(on){ document.getElementById('cspin').classList.toggle('on',on); }
function curHolding(){ return ((LAST&&LAST.holdings)||[]).find(x=>x.ticker===curTicker); }
function requestChart(){
  if(curTicker==='__PORTFOLIO__' && curRange==='1D'){
    drawBigChart(LAST.intraday.t,LAST.intraday.v,LAST.totals.dayChange>=0,CURSYM); return; }
  const h=curHolding();
  const sym = curTicker==='__PORTFOLIO__' ? '^NDX' : ((h&&h.chartSymbol)||curTicker);
  spin(true);
  send({action:'chart',ticker:sym,range:curRange,tag:curTicker});
}
function setChart(tag,range,t,c){
  spin(false);
  if(tag!==curTicker || range!==curRange) return;
  const up=c.length>1 ? c[c.length-1]>=c[0] : true;
  const h=curHolding();
  const unit = (tag==='__PORTFOLIO__') ? '' : ((h&&h.kind==='equity') ? h.priceCur : '');
  drawBigChart(t,c,up,unit);
}
let lastDraw=null;
function redrawChart(){ if(lastDraw && document.body.classList.contains('mode-detail'))
  drawBigChart(lastDraw.t,lastDraw.c,lastDraw.up,lastDraw.unit); }
function drawBigChart(tArr,cArr,up,unit){
  lastDraw={t:tArr,c:cArr,up,unit:unit||''};
  const u=unit||'';
  // only the PORTFOLIO total-value chart is private money; stock prices & the
  // Nasdaq-100 index are public, so their axis/tooltip numbers always show.
  const hideVals = (curTicker==='__PORTFOLIO__') && HIDDEN;
  const ctx=document.getElementById('bigChart');
  const color=up?getCss('--pos'):getCss('--neg');
  const g=ctx.getContext('2d');
  const grad=g.createLinearGradient(0,0,0,Math.max(ctx.height,260));
  grad.addColorStop(0,color+'44'); grad.addColorStop(1,color+'00');
  if(bigChart) bigChart.destroy();
  bigChart=new Chart(ctx,{
    type:'line',
    data:{labels:(cArr||[]).map((_,i)=>i),
      datasets:[{data:cArr,borderColor:color,backgroundColor:grad,fill:true,
        borderWidth:2,tension:.25,pointRadius:0,pointHoverRadius:4,
        pointHoverBackgroundColor:color,pointHoverBorderColor:'#fff'}]},
    options:{responsive:true,maintainAspectRatio:false,animation:{duration:600},
      interaction:{intersect:false,mode:'index'},
      plugins:{legend:{display:false},
        tooltip:{displayColors:false,backgroundColor:'rgba(10,12,18,.92)',
          borderColor:'rgba(255,255,255,.1)',borderWidth:1,padding:10,
          callbacks:{title:items=>{ const i=items[0].dataIndex,ts=tArr&&tArr[i];
              return ts?new Date(ts*1000).toLocaleString():''; },
            label:it=> hideVals ? '  •••••' : '  '+u+fmtMoney(it.parsed.y)}}},
      scales:{x:{display:false},
        y:{position:'right',grid:{color:'rgba(255,255,255,.05)'},
          ticks:{color:'#6b7385',font:{size:10},
            callback:v=> hideVals ? '•••' : u+abbrev(v)}}}}
  });
}

//=============================================================== wiring
document.getElementById('bClose').onclick=()=>send({action:'hide'});
document.getElementById('bClose2').onclick=()=>send({action:'hide'});
document.getElementById('bRefresh').onclick=()=>{ const b=document.getElementById('bRefresh');
  b.style.transition='.6s'; b.style.transform='rotate(360deg)';
  setTimeout(()=>{b.style.transition='';b.style.transform='';},620); send({action:'refresh'}); };
document.getElementById('bSettings').onclick=()=>send({action:'settings'});
document.getElementById('bEye').onclick=toggleHidden;
document.getElementById('bEye2').onclick=toggleHidden;
// click a blurred amount to peek; click again to re-blur (capture, so it wins over row/hero)
document.addEventListener('click',e=>{ const a=e.target.closest('.amt');
  if(a && HIDDEN){ a.classList.toggle('show'); e.stopPropagation(); e.preventDefault(); } },true);
document.getElementById('bBack').onclick=closeDetail;
document.getElementById('heroClick').onclick=()=>{ if(LAST&&LAST.holdings.length) openOverview(); };
document.getElementById('dragZone').addEventListener('mousedown',e=>{ if(e.button===0) send({action:'drag'}); });
document.querySelector('.dhdr').addEventListener('mousedown',e=>{
  if(e.target.closest('button')) return; if(e.button===0) send({action:'drag'}); });
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){
  if(document.body.classList.contains('mode-detail')) closeDetail(); else send({action:'hide'}); }});
window.addEventListener('resize',()=>{ if(LAST&&document.body.classList.contains('mode-compact')) setData(LAST); });

window.setData=setData; window.setChart=setChart;
window.setAccent=function(hex){ const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  document.documentElement.style.setProperty('--accent',hex);
  document.documentElement.style.setProperty('--accent-soft',`rgba(${r},${g},${b},.16)`); };

applyHidden();
send({action:'ready'});
</script>
